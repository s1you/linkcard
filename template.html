<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{pageTitle}}</title>
  <meta name="description" content="{{pageDescription}}">
  <link rel="canonical" href="{{canonicalUrl}}">

  <!-- Open Graph / Facebook / Discord / LINE -->
  <meta property="og:site_name" content="{{siteTitle}}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{ogDescription}}">
  <meta property="og:url" content="{{canonicalUrl}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:alt" content="{{ogTitle}}">

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ogTitle}}">
  <meta name="twitter:description" content="{{ogDescription}}">
  <meta name="twitter:image" content="{{ogImage}}">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="{{relativeRoot}}assets/css/style.css">

  <!-- Analytics -->
  {{analyticsTag}}
</head>
<body data-profile-id="{{profileId}}" {{bodyStyleAttribute}}>

  <div class="site-container">
    <header class="profile-header">
      <div class="profile-avatar-wrapper">
        <img src="{{profileImageSrc}}" alt="{{name}}" class="profile-avatar" width="96" height="96" onerror="this.src='{{relativeRoot}}images/profile/siyou.svg'">
      </div>
      <h1 class="profile-name">{{name}}</h1>
      {{bioHtml}}
    </header>

    <main class="links-container">
      {{linksHtml}}
    </main>

    <footer class="site-footer">
      <div class="footer-nav">
        <a href="{{relativeRoot}}" class="footer-link">すべてのプロフィール</a>
      </div>
      <p class="footer-copy">&copy; {{name}} - Powered by Linkbio</p>
    </footer>
  </div>

  <script src="{{relativeRoot}}assets/js/main.js" defer></script>
  {{autoRedirectTag}}
</body>
</html>
