<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found - ページが見つかりません</title>
  <meta name="description" content="お探しのプロフィールページは見つかりませんでした。">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

  <div class="site-container">
    <div class="error-container">
      <div class="error-code">404</div>
      <h1 class="error-title">ページが見つかりません</h1>
      <p class="error-desc">
        指定されたURLのプロフィールは存在しないか、移動した可能性があります。
      </p>
      <a href="./" class="error-button">トップページに戻る</a>
    </div>

    <footer class="site-footer">
      <p class="footer-copy">&copy; Linkbio</p>
    </footer>
  </div>

</body>
</html>
