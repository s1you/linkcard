<body data-profile-id="portal">

  <div class="site-container">
    <header class="portal-header">

    <main class="portal-list">
      
      <a href="./siyou/" class="portal-item-link">
        <img src="./images/profile/siyou.svg" alt="siyou" class="portal-item-avatar">
        <div class="portal-item-info">
          <span class="portal-item-name">siyou</span>

          <span class="portal-item-name">siyou Games</span>
          <span class="portal-item-desc">ゲーム配信・コミュニティ専用リンク集</span>
        </div>

      <a href="./sns/" class="portal-item-link">
        <img src="./images/profile/siyou.svg" alt="siyou / SNS Hub" class="portal-item-avatar">

        </div>
        <span class="portal-item-badge">2 リンク</span>
