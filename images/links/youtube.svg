<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="ytBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b1b" />
      <stop offset="100%" stop-color="#141212" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#ytBg)" />
  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="180" x2="1280" y2="180" />
    <line x1="0" y1="360" x2="1280" y2="360" />
    <line x1="0" y1="540" x2="1280" y2="540" />
    <line x1="320" y1="0" x2="320" y2="720" />
    <line x1="640" y1="0" x2="640" y2="720" />
    <line x1="960" y1="0" x2="960" y2="720" />
  </g>
  <!-- YouTube Icon Play Button -->
  <g transform="translate(640, 290)">
    <rect x="-80" y="-55" width="160" height="110" rx="30" fill="#e02424" />
    <polygon points="-15,-30 35,0 -15,30" fill="#ffffff" />
  </g>
  <text x="640" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#f3f4f6" text-anchor="middle" letter-spacing="1">YouTube</text>
  <text x="640" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#9ca3af" text-anchor="middle" letter-spacing="2">VIDEO &amp; LIVE STREAM</text>
</svg>
